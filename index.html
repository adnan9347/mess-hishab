<!doctype html>
<html lang="bn" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>মেস হিসাব · Mess Hishab</title>
  <meta name="description" content="Meal and bazar accounting for student messes in Bangladesh — tap your meals, the app does the maths.">
  <meta name="theme-color" content="#F5F6F4">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- No-flash: apply saved theme and language before first paint. -->
  <script>
    (function () {
      try {
        var mode = JSON.parse(localStorage.getItem('mh.theme') || 'null') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.bsTheme = dark ? 'dark' : 'light';
        if (dark) root.classList.add('dark');
        var lang = JSON.parse(localStorage.getItem('mh.locale') || 'null') || 'bn';
        root.lang = lang;
        if (lang === 'bn') root.classList.add('lang-bn');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" aria-live="off"></div>
  <div id="toasts" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:24px">Mess Hishab needs JavaScript. মেস হিসাব চালাতে JavaScript চালু করুন।</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
